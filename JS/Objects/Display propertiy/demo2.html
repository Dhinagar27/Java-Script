<!DOCTYPE html>
<html>
    <head>

    </head>
    <body>
        <h1>Display Method 2 </h1>
        <p id="demo"></p>
        <script>
            var person = {
                name : "Dhinagar",
                age  : 22,
                city : "Erode"
            }

            let text = ""
            for(let x in person){
                text = text + person[x] + " "
            }

            document.getElementById('demo').innerHTML = text
        </script>
    </body>
</html>
