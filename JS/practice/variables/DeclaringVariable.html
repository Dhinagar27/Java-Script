<!DOCTYPE html>
<html>
    <head></head>
    <body>
        <h1>Declaring Variables !!</h1>
        <p>Click The Button below to See My Fav Car</p>
        <p id="demo"></p>
        <button onclick="car()">Click Here</button>
        <script>
            var carname;
            carname = 'Audi';
            function car(){
            document.getElementById('demo').innerHTML = carname;
            }
        </script>
    </body>
</html>
