<!DOCTYPE html>
<html>
    <head>
        <script>
            function change(){
                document.getElementById('demo').innerHTML = "Paragraph Changed !";
            }
        </script>
    </head>
    <body>
        <h1>Script Can be Placed In the head and Function can be created and used by calling It</h1>
        <p id="demo">A Paragraph</p>
        <button onclick="change()">Click Here To try</button>
    </body>
</html>
