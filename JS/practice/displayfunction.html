    <body>
        <h1>This Section about display Function in HTML</h1>
        <p id="demo"> This Paragraph will be disappeared after you Click the Button Bellow</p>

        <h1>Then JavaScript also Show hidden HTML Elements</h1>
        <p id="demo2" style="display: none;">Hi There !!</p>
        <button onclick="document.getElementById('demo2').style.display = 'block'">Click Here !!</button>
