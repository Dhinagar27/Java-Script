<!DOCTYPE html>
<html>
    <head></head>
    <body>
        <h1>Script can be Placed inside The Body</h1>
        <p id="demo">A paragraph</p>
        <button onclick="change()">
            click Here
        </button>
        <script>
            function change(){
                document.getElementById('demo').innerHTML = 'Paragraph Changed';
            }
        </script>
    </body>
</html>
